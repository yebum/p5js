<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>키워드 입력</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Sans KR', sans-serif;
      padding: 32px 24px;
      color: #fff;
    }

    .title {
      font-size: 11px;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-bottom: 48px;
      text-align: center;
    }

    .prompt {
      font-size: 22px;
      font-weight: 300;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 40px;
      color: rgba(255,255,255,0.85);
    }

    .input-wrap {
      width: 100%;
      max-width: 340px;
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 18px;
      font-family: 'Noto Sans KR', sans-serif;
      color: #fff;
      outline: none;
      transition: border-color 0.3s, background 0.3s;
      text-align: center;
      letter-spacing: 0.05em;
    }

    input[type="text"]::placeholder {
      color: rgba(255,255,255,0.2);
    }

    input[type="text"]:focus {
      border-color: rgba(150, 100, 255, 0.6);
      background: rgba(150, 100, 255, 0.05);
    }

    button {
      margin-top: 16px;
      width: 100%;
      max-width: 340px;
      padding: 18px;
      background: rgba(150, 100, 255, 0.8);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 500;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      background: rgba(150, 100, 255, 1);
      transform: scale(0.98);
    }

    button:disabled {
      background: rgba(255,255,255,0.1);
      cursor: not-allowed;
    }

    .feedback {
      margin-top: 24px;
      font-size: 13px;
      color: rgba(150, 100, 255, 0.9);
      text-align: center;
      min-height: 20px;
      letter-spacing: 0.05em;
      transition: opacity 0.3s;
    }

    .sent-list {
      margin-top: 40px;
      width: 100%;
      max-width: 340px;
    }

    .sent-title {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.2);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .sent-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      animation: tagIn 0.4s ease;
    }

    @keyframes tagIn {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    .dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: rgba(150,100,255,0.8);
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="title"><span class="dot"></span>Beyond the Center Node</div>

  <div class="prompt">지금 떠오르는<br>단어를 입력하세요</div>

  <div class="input-wrap">
    <input type="text" id="keyword" placeholder="키워드" maxlength="20" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <button id="sendBtn" onclick="sendKeyword()">전시에 띄우기</button>

  <div class="feedback" id="feedback"></div>

  <div class="sent-list" id="sentList" style="display:none">
    <div class="sent-title">내가 보낸 키워드</div>
    <div class="sent-tags" id="tags"></div>
  </div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDUzNgom4q3EdWVKhmTVse5qnloDAmjUiQ",
    authDomain: "beyond-the-center-node.firebaseapp.com",
    databaseURL: "https://beyond-the-center-node-default-rtdb.firebaseio.com",
    projectId: "beyond-the-center-node",
    storageBucket: "beyond-the-center-node.firebasestorage.app",
    messagingSenderId: "968268209370",
    appId: "1:968268209370:web:67c6785e85b1e4a52f59e3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.sendKeyword = async function() {
    const input = document.getElementById('keyword');
    const word = input.value.trim();
    if (!word) return;

    const btn = document.getElementById('sendBtn');
    const feedback = document.getElementById('feedback');

    btn.disabled = true;
    feedback.textContent = '전송 중...';

    try {
      await push(ref(db, 'keywords'), {
        text: word,
        time: Date.now()
      });

      feedback.textContent = '✓ 전시 화면에 나타났어요!';
      input.value = '';

      // 보낸 태그 목록
      const sentList = document.getElementById('sentList');
      const tags = document.getElementById('tags');
      sentList.style.display = 'block';
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = word;
      tags.appendChild(tag);

      setTimeout(() => { feedback.textContent = ''; }, 3000);
    } catch (e) {
      feedback.textContent = '오류가 발생했어요. 다시 시도해주세요.';
    }

    btn.disabled = false;
  };

  // 엔터키 지원
  document.getElementById('keyword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') window.sendKeyword();
  });
</script>
</body>
</html>
